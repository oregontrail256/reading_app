# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Reader
options:
  bundleIdPrefix: com.jonathaneng
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ReaderCore:
    path: ReaderCore
targets:
  Reader:
    type: application
    platform: iOS
    sources:
      - path: Reader
      - path: ../shared/lexicon.json
        buildPhase: resources
      - path: ../shared/patterns.json
        buildPhase: resources
    dependencies:
      - package: ReaderCore
    info:
      path: Reader/Info.plist
      properties:
        CFBundleDisplayName: Reader
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        # The book server usually runs on your Mac over plain HTTP on the home network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Reader talks to your book server on your home network to write new books.
        UIAppFonts:
          - Andika-Regular.ttf
          - Andika-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathaneng.reader
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        # Set your team here or in Xcode > Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
schemes:
  Reader:
    build:
      targets:
        Reader: all
    test:
      targets: []
